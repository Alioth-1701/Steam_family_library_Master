<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam 家庭游戏库</title>
<style>
  :root {
    --bg: #12151c; --bg-card: #1c2230; --text: #e4e8f0;
    --text-dim: #8b93a5; --accent: #66c0f4; --danger: #f47c66; --new-badge: #e8b33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .updated { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  .stat.new .num { color: var(--new-badge); }
  .stat.blocked .num { color: var(--danger); }
  .empty { text-align: center; color: var(--text-dim); margin-top: 80px; line-height: 2; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .game { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3;
    background: var(--bg-card); }
  .game img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .game.off { filter: grayscale(.9); opacity: .45; }
  .badge { position: absolute; top: 6px; left: 6px; background: var(--new-badge);
    color: #1a1405; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Steam 家庭游戏库</h1>
  <div class="updated" id="updated">加载中…</div>
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="num" id="s-total">0</div><div class="label">游戏总数</div></div>
    <div class="stat new"><div class="num" id="s-new">0</div><div class="label">新入库（最近 30 天）</div></div>
    <div class="stat blocked"><div class="num" id="s-blocked">0</div><div class="label">不可共享</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty"></div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);

fetch("data/public_library.json").then(r => {
  if (!r.ok) throw new Error("数据尚未生成");
  return r.json();
}).then(d => {
  $("updated").textContent = "数据更新于 " + (d.updated_at || "").replace("T", " ").slice(0, 19) + " UTC";
  $("stats").style.display = "";
  $("s-total").textContent = d.count;
  $("s-new").textContent = d.games.filter(g => g.is_new).length;
  $("s-blocked").textContent = d.games.filter(g => !g.playable).length;
  const grid = $("grid");
  d.games.forEach(g => {
    const div = document.createElement("div");
    div.className = "game" + (g.playable ? "" : " off");
    if (!g.playable && g.exclude_reason) div.title = g.exclude_reason + "（" + (g.owners.join("、") || "未知") + "）";
    else div.title = g.name + " — " + (g.owners.join("、") || "未知");
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = g.name;
    img.src = "https://cdn.cloudflare.steamstatic.com/steam/apps/" + g.appid + "/library_600x900_2x.jpg";
    img.addEventListener("error", function onErr() {
      if (!img.dataset.fallback) { img.dataset.fallback = "1";
        img.src = "https://cdn.cloudflare.steamstatic.com/steam/apps/" + g.appid + "/header.jpg"; }
      else { img.remove(); div.textContent = g.name;
        div.style.cssText += "display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;padding:8px;text-align:center;"; }
    });
    div.appendChild(img);
    if (g.is_new) { const b = document.createElement("div"); b.className = "badge"; b.textContent = "NEW"; div.appendChild(b); }
    grid.appendChild(div);
  });
}).catch(e => {
  $("updated").textContent = "";
  const empty = $("empty");
  empty.classList.remove("hidden");
  empty.innerHTML = "暂无公开数据。<br>等待 GitHub Actions 首次成功更新后自动出现。";
});
</script>
</body>
</html>
